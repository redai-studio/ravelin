name: Release

# Pushing a version tag (e.g. 0.8.0, 1.0.0rc1) builds and publishes to PyPI.
# Publishing uses PyPI Trusted Publishing: no API token is stored in the repository.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check tag matches VERSION.txt
        run: |
          version="$(tr -d '[:space:]' < VERSION.txt)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION.txt ($version)" >&2
            exit 1
          fi
      - name: Build
        run: |
          pip install hatch twine
          hatch build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ravelin/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
