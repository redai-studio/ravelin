name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # reno lint reads release notes from git history
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install Hatch and pre-commit
        run: pip install hatch pre-commit
      - name: Pre-commit hooks
        # Formatter versions live in .pre-commit-config.yaml. Tests run in the unit job,
        # and the branch guard only applies to local commits.
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: hatch-tests,no-commit-to-branch
      - name: Lint
        run: hatch run test:lint
      - name: Types
        run: hatch run test:types

  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          # diff-cover compares against the PR base branch
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Hatch
        run: pip install hatch
      - name: Unit tests
        run: hatch run test:unit
      - name: Diff coverage
        if: github.event_name == 'pull_request' && matrix.python-version == '3.10'
        run: hatch run test:diff-cov origin/${{ github.base_ref }}
